<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test webhook — Winterfell38</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#12061f;color:#fff;padding:1.5rem;line-height:1.6}
    h1{font-size:1.3rem;margin-bottom:1rem}
    button{background:linear-gradient(135deg,#ff3d8b,#ff8a3d);border:0;color:#fff;font-weight:800;
      padding:.9rem 1.4rem;border-radius:14px;font-size:1rem;cursor:pointer}
    pre{margin-top:1.2rem;background:rgba(255,255,255,.08);padding:1rem;border-radius:12px;
      white-space:pre-wrap;word-break:break-word;font-size:.85rem}
  </style>
</head>
<body>
  <h1>Test d'envoi vers Make</h1>
  <p>Appuie sur le bouton, puis regarde l'historique de ton scénario Make.</p>
  <button id="go">Envoyer la commande test</button>
  <pre id="out">Rien envoyé pour l'instant.</pre>

  <script>
    const url = "https://hook.eu1.make.com/q5pfykzr33fdog8yk86tt7lla861ssbf";

    const payload = {
      source: "site",
      shop: "WINTERFELL38",
      order_date: new Date().toLocaleString("fr-FR"),
      customer: {
        fullname: "TEST webhook",
        email: "",
        phone: "0600000000",
        address: "1 rue de test",
        shipping: "Livraison",
        message: "Envoi de test depuis la page de verification"
      },
      items: [
        {
          product_id: 1,
          product_name: "Test produit",
          variant: "1G",
          quantity: 2,
          unit_price: 40,
          line_total: 80
        }
      ],
      currency: "EUR",
      total: 80
    };

    const out = document.getElementById("out");

    document.getElementById("go").addEventListener("click", async () => {
      out.textContent = "Envoi en cours...";
      const body = JSON.stringify(payload);

      let beacon = "non tente";
      try {
        beacon = navigator.sendBeacon(url, new Blob([body], { type: "application/json" }))
          ? "accepte par le navigateur"
          : "refuse par le navigateur";
      } catch (e) {
        beacon = "erreur : " + e.message;
      }

      let fetchInfo;
      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body
        });
        const text = await res.text();
        fetchInfo = "statut HTTP " + res.status + " " + res.statusText + "\nreponse : " + (text || "(vide)");
      } catch (e) {
        fetchInfo = "echec reseau : " + e.message;
      }

      out.textContent = "sendBeacon : " + beacon + "\n\nfetch : " + fetchInfo;
    });
  </script>
</body>
</html>
