<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aperçu des palettes — Winterfell38</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0b0b0f;color:#fff;padding:1.2rem;line-height:1.5}
  h1{font-size:1.25rem;margin-bottom:.3rem}
  .hint{color:#aaa;font-size:.85rem;margin-bottom:1.2rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
  .card{border-radius:18px;padding:1rem;border:1px solid rgba(255,255,255,.12);position:relative;overflow:hidden}
  .name{font-weight:800;font-size:.95rem;letter-spacing:.04em;margin-bottom:.7rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .tag{font-size:.68rem;font-weight:700;padding:.15rem .5rem;border-radius:999px;background:rgba(255,255,255,.14)}
  .price{font-size:1.4rem;font-weight:900;margin-bottom:.6rem}
  .row{display:flex;gap:.4rem;margin-bottom:.7rem;flex-wrap:wrap}
  .chip{font-size:.7rem;font-weight:700;padding:.25rem .6rem;border-radius:10px;border:2px solid rgba(255,255,255,.2)}
  .btn{display:block;text-align:center;padding:.7rem 1rem;border-radius:14px;font-weight:800;font-size:.9rem;border:0;width:100%;color:#fff}
  .dots{display:flex;gap:.35rem;margin-top:.7rem}
  .dot{width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.25)}
</style>
</head>
<body>
  <h1>Tes palettes en un coup d'œil</h1>
  <p class="hint">Repère le nom de celle qui te plaît, puis écris-le dans <code>ACTIVE_THEME</code>.</p>
  <div class="grid" id="grid"></div>

  <script src="theme.js"></script>
  <script>
    (() => {
      "use strict";

      const grid = document.getElementById("grid");
      const actuelle = (typeof ACTIVE_THEME !== "undefined") ? ACTIVE_THEME : "";

      Object.entries(THEMES).forEach(([nom, t]) => {
        const card = document.createElement("div");
        card.className = "card";

        card.style.background = t.surface;
        card.style.color = t.text;
        card.style.boxShadow = `0 0 22px color-mix(in srgb, ${t.primary} 45%, transparent)`;

        card.innerHTML = `
          <div class="name">
            <span style="color:${t.accent}">${nom}</span>
            ${nom === actuelle ? '<span class="tag">actuelle</span>' : ''}
          </div>

          <div class="price" style="color:${t.secondary}">40€</div>

          <div class="row">
            <span class="chip" style="background:${t.primary};border-color:${t.primary};color:#fff">1G</span>
            <span class="chip" style="border-color:${t.accent};color:${t.accent}">3G</span>
            <span class="chip" style="color:${t.muted}">5G</span>
          </div>

          <button class="btn" style="background:${t.gradient};color:#fff;box-shadow:0 6px 20px color-mix(in srgb, ${t.primary} 45%, transparent)">
            Ajouter au panier
          </button>

          <div class="dots">
            <span class="dot" style="background:${t.bg}"></span>
            <span class="dot" style="background:${t.surface}"></span>
            <span class="dot" style="background:${t.primary}"></span>
            <span class="dot" style="background:${t.secondary}"></span>
            <span class="dot" style="background:${t.accent}"></span>
            <span class="dot" style="background:${t.muted}"></span>
          </div>
        `;

        grid.appendChild(card);
      });
    })();
  </script>
</body>
</html>
